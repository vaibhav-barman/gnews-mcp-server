[project]
name = "gnews-mcp-server"
version = "0.1.0"
description = "An MCP server for searching GNews articles and headlines"
readme = "README.md"
authors = [
    { name = "Vaibhav", email = "vaibhavbarman2609@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.27,<1",
    "mcp>=1.26.0,<2",
    "python-dotenv>=1.2.4",
]

[project.scripts]
gnews-mcp-server = "gnews_mcp_server:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
